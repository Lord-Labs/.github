name: Feature request / اقتراح تحسين
description: Describe the problem and the smallest useful improvement.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful outcome and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How to verify it
      description: What observable result would show the improvement works?
    validations:
      required: true
